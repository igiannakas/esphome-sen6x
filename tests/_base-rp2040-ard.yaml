# Shared by the config-validation tests: build straight from this checkout.
esphome:
  name: sen6x-test
rp2040:
  board: rpipicow
  framework:
    platform_version: https://github.com/maxgerhardt/platform-raspberrypi.git
logger:
i2c:
  - id: i2c_bus
    scl: GPIO5
    sda: GPIO4
    scan: true
external_components:
  - source:
      type: local
      path: ../components
    components: [sen6x]
