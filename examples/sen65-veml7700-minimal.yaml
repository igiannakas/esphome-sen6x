# ============================================================
# BAREBONES  —  XIAO ESP32-C6 + SEN65 + VEML7700
#
# Sensors only: the SEN65 reporting temperature, and the
# VEML7700 reporting every channel it has. No automations, no
# lambdas, no template entities, no LED.
#
# The one exception is the antenna init in esphome: on_boot and
# the output: block it drives. That is board bring-up rather
# than application logic — delete both if you want the file
# literally bare, at the cost of RF performance on this module.
# ============================================================

substitutions:

  device_name: sen65-test
  friendly_name: "SEN65 Test"

  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

  # Seeed XIAO ESP32-C6 silkscreen: D4 = GPIO22, D5 = GPIO23
  pin_sda: D4
  pin_scl: D5

# ============================================================
# FIRMWARE
# ============================================================

esphome:
  name: ${device_name}
  friendly_name: "${friendly_name}"
  on_boot:
    # Both low: RF switch powered, PCB antenna selected. The
    # Arduino core has done this for you since 3.0.4; esp-idf
    # does not, and left alone the internal antenna still
    # radiates, just badly — nothing looks broken, the range is
    # quietly worse than it should be.
    #
    # 700 rather than 800 so the GPIO outputs — which set up at
    # 800 — have configured the pins by the time this writes
    # them, and still well clear of WiFi at 250.
    - priority: 700
      then:
        - output.turn_off: rf_switch_power
        - output.turn_off: antenna_select

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:

# ============================================================
# CONNECTIVITY
# ============================================================

api:

ota:
  - platform: esphome

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  ap:
    ssid: "${device_name} Fallback"
    password: "${wifi_password}"

captive_portal:

# ============================================================
# I2C
#
# VEML7700 = 0x10   SEN65 = 0x6B
# ============================================================

i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  scan: true

# ============================================================
# ANTENNA
#
# GPIO3    RF switch power   LOW = powered
# GPIO14   antenna select    LOW = internal
# ============================================================

output:
  - platform: gpio
    id: rf_switch_power
    pin: GPIO3

  - platform: gpio
    id: antenna_select
    pin: GPIO14

# ============================================================
# SENSORS
# ============================================================

sensor:

  # ----------------------------------------------------------
  # SEN65  —  temperature only
  #
  # type: is optional. The component reads the product name off
  # the device at boot and infers the part either way; setting
  # it turns a wrong sensor into one "Configured type (used)
  # mismatches product" warning. The configured value wins, so
  # a wrong one is worse than none.
  #
  # The SEN65 measures PM, RH, VOC and NOx too — they are read
  # off the bus on every cycle regardless, this file just does
  # not publish them.
  #
  # Nothing appears for the first 60 s: that is the component's
  # default startup_delay holding values back while the sensor
  # warms up, not a fault.
  # ----------------------------------------------------------
  - platform: sen6x
    address: 0x6B
    type: SEN65
    update_interval: 10s
    temperature:
      name: "Temperature"
      accuracy_decimals: 2

  # ----------------------------------------------------------
  # VEML7700  —  every channel
  #
  #   ambient_light      ALS channel, eye-weighted, lx
  #   full_spectrum      WHITE channel, includes near-IR, lx
  #   infrared           full_spectrum - ambient_light, >= 0
  #   *_counts           the raw registers behind those two
  #   actual_gain        what auto_mode currently has set
  #   actual_integration_time    likewise, in ms
  #
  # Both lux channels share one scale factor, so ALS and WHITE
  # are directly comparable. Auto-gain is chosen from the ALS
  # counts alone, so WHITE can clip at full scale under a very
  # IR-heavy source while ALS is still in range — the counts
  # entities are what show you that.
  # ----------------------------------------------------------
  - platform: veml7700
    address: 0x10
    update_interval: 5s
    auto_mode: true
    lux_compensation: true
    ambient_light:
      name: "Illuminance"
    ambient_light_counts:
      name: "Illuminance Counts"
    full_spectrum:
      name: "Full Spectrum"
    full_spectrum_counts:
      name: "Full Spectrum Counts"
    infrared:
      name: "Infrared"
    actual_gain:
      name: "VEML - Actual Gain"
    actual_integration_time:
      name: "VEML - Integration Time"
