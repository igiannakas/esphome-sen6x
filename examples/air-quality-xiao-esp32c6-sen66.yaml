# ============================================================
# AIR QUALITY  —  XIAO ESP32-C6 + SEN6x + VEML7700
#
# The settings for one node. The logic is in
# common/air-quality-core.yaml, which must sit next to this
# file.
#
# Values ending _default only set a starting value in Home
# Assistant. After the first boot, change them there.
# ============================================================

substitutions:

  # --- SENSOR MODEL -----------------------------------------
  #
  # For a SEN65 (no CO2), set sen_model: SEN65,
  # co2_state: "-1" and co2_fault: "false", and comment out
  # the MODEL: block at the end of this file.
  #
  sen_model: SEN66
  co2_state: "id(sen6x_co2).state"
  co2_fault: "id(sen6x_co2_error).state"

  # --- DEVICE -----------------------------------------------
  device_name: bedroom-air-quality
  friendly_name: "Bedroom Air Quality"

  # --- NETWORK  (values in secrets.yaml) --------------------
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

  # --- PINS  (XIAO ESP32-C6 silkscreen names) ---------------
  pin_sda: D4
  pin_scl: D5
  pin_status_led: D1

  # --- SEN6x ------------------------------------------------
  #
  # temp_offset corrects for the board warming the sensor.
  # Check against a reference thermometer. Typical values:
  #
  #   -0.30   open board
  #   -0.98   large enclosure
  #   -1.16   small enclosure
  #
  # timeout_ms is how long without a reading before the sensor
  # is reported as not responding.
  #
  sen6x_sample_interval: 10s
  sen6x_temp_offset: "-0.30"
  sen6x_timeout_ms: "60000"

  # --- AIR QUALITY LEVELS -----------------------------------
  #
  # Each reading is scored against its three thresholds and the
  # LED shows the worst score:
  #
  #   below l1    good        green
  #   l1 to l2    elevated    amber
  #   l2 to l3    poor        red
  #   above l3    ventilate   flashing red
  #
  # CO2 is in ppm, PM in ug/m3. The pm25 levels also apply to
  # PM1, and the pm10 levels to PM4.
  #
  co2_l1: "800"
  co2_l2: "1000"
  co2_l3: "1500"

  pm25_l1: "12"
  pm25_l2: "36"
  pm25_l3: "55"

  pm10_l1: "17"
  pm10_l2: "51"
  pm10_l3: "78"

  voc_l1: "150"
  voc_l2: "250"
  voc_l3: "400"

  nox_l1: "20"
  nox_l2: "150"
  nox_l3: "300"

  # --- VOC LEARNING -----------------------------------------
  #
  # The VOC Index compares the air with what the sensor has
  # learned is normal for the room.
  #
  #   gating_max_duration_minutes   longest a high reading can
  #                                 pause learning. 720 suits a
  #                                 bedroom, 3000 a room with a
  #                                 3D printer
  #   learning_time_offset_hours    how quickly "normal" adapts
  #   learning_time_gain_hours      how quickly the scale adapts
  #
  voc_gating_max_duration_minutes: "720"
  voc_learning_time_offset_hours: "24"
  voc_learning_time_gain_hours: "24"

  # --- OPEN WINDOW DETECTION --------------------------------
  #
  # A window is reported open when the room cools quickly, and
  # closed when it warms back up. The open and close rates are
  # set in Home Assistant; watch Window - Temperature Rate
  # during an airing to tune them.
  #
  #   temp_rate_interval_s          how often the rate updates
  #   temp_rate_window              readings it averages over
  #   window_open_samples           readings in a row to
  #                                 report open
  #   window_close_samples          readings in a row to
  #                                 report closed
  #   window_max_hold_default_min   report closed after this
  #                                 many minutes regardless
  #
  # Anything that cools the room quickly reads as an open
  # window, and a window onto air at room temperature is not
  # noticed.
  #
  temp_rate_interval_s: "30"
  temp_rate_window: "6"

  window_open_rate_default: "-0.10"
  window_close_rate_default: "0.02"
  window_open_samples: "2"
  window_close_samples: "4"
  window_max_hold_default_min: "60"

  # --- SUN LOCKOUT ------------------------------------------
  #
  # Sun on the board warms it, and the cooling afterwards looks
  # like an open window. Detection pauses while the light is
  # above the lockout level or the board warms faster than the
  # heat spike rate, and resumes once the temperature has
  # settled for window_settle_samples readings, or after the
  # lockout time.
  #
  # The lockout level is compared with Full Spectrum, not
  # Illuminance. Set it in Home Assistant from what Full
  # Spectrum shows with sun on the board.
  #
  sun_lockout_lux_default: "1000"
  sun_lockout_minutes_default: "45"
  heat_spike_rate_default: "0.30"
  window_settle_samples: "3"

  # --- VOC BASELINE SAVE ------------------------------------
  #
  # How often the learned VOC baseline is saved, so a restart
  # or power cut does not reset it. The first save is one
  # interval after boot. Press SEN - VOC Baseline Save before
  # a planned restart.
  #
  voc_state_save_interval: 6h

  # --- LIGHT SENSOR -----------------------------------------
  #
  # With LED - Ambient Light Control on, the LED only lights
  # when the room is lit. The threshold is set in Home
  # Assistant and compared with Full Spectrum:
  #
  #   below 1     dark room
  #   1 to 5      phone or TV glow
  #   20 to 50    bedside lamp
  #   100 to 300  ceiling light
  #   above 500   daylight
  #
  #   lux_sample_interval     how often the sensor is read
  #   lux_publish_min_gap     shortest time between updates
  #                           to Home Assistant
  #   lux_publish_delta       send an update on this much change
  #   lux_publish_heartbeat   send an update at least this often
  #
  lux_sample_interval: 2s
  lux_publish_min_gap: 4s
  lux_publish_delta: "10%"
  lux_publish_heartbeat: 300s
  dark_room_threshold_default: "1"

  # --- STATUS LED -------------------------------------------
  #
  # With LED - Ambient Light Control on, the LED dims with the
  # room: min brightness at the Ambient Light Threshold, rising
  # in proportion to max brightness at max_lux (compared with
  # Illuminance), and holding there above it. With it off, the
  # LED stays at max brightness. Brightness in %.
  #
  # Flashing is used for "ventilate" and sensor faults,
  # breathing for an open window. Keep breathe_fade just under
  # breathe_step.
  #
  led_brightness_max_default: "100"
  led_brightness_min_default: "20"
  led_brightness_max_lux_default: "400"
  led_flash_on: 200ms
  led_flash_off: 800ms
  led_breathe_step: 2000ms
  led_breathe_fade: 1800ms

  # --- DIAGNOSTICS ------------------------------------------
  #
  # How often Wi-Fi signal, uptime and chip temperature are
  # reported.
  #
  diag_interval: 60s

# ============================================================
# CORE
#
# The shared logic. It lives in a subfolder so the ESPHome
# dashboard does not list it as a device.
# ============================================================

packages:
  core: !include common/air-quality-core.yaml

# ============================================================
# MODEL: SEN66 only
#
# The CO2 reading and its error flag. Comment out for a SEN65.
# ============================================================

sensor:
  - id: !extend sen6x_dev
    co2:
      id: sen6x_co2
      name: "CO2"

binary_sensor:
  - platform: sen6x
    sen6x_id: sen6x_dev
    co2_error:
      id: sen6x_co2_error
      name: "SEN - Error - CO2"
      internal: true
